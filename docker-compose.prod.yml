# Stack de PRODUÇÃO do portal. Web em :8083 (não conflita com Zabbix/Grafana).
# Banco PostgreSQL próprio (isolado). Use com: bash deploy.sh
#
# A VM é compartilhada com Zabbix + MariaDB + Grafana (3 GB de RAM), então cada
# serviço tem limite de memória e configuração enxuta. Os limites são tetos de
# segurança (o uso normal fica bem abaixo) — impedem que um pico do portal
# derrube o Zabbix.

# Logs dos contêineres com rotação (sem isso crescem sem limite no disco).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - redis
    mem_limit: 512m
    logging: *logging

  # Cache do portal (leituras do GLPI). Só memória, com limite e descarte LRU:
  # não cresce sem fim e, se reiniciar, o cache simplesmente recomeça vazio.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 96m
    logging: *logging

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    mem_limit: 64m
    logging: *logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-itsm}
      POSTGRES_USER: ${DB_USERNAME:-itsm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    # Banco pequeno: buffers e conexões reduzidos (padrão reserva 128 MB+).
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    volumes:
      - itsm-db:/var/lib/postgresql/data
    mem_limit: 256m
    logging: *logging

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - db
      - redis
    command: ["php", "artisan", "schedule:work"]
    mem_limit: 256m
    logging: *logging

volumes:
  itsm-db:
