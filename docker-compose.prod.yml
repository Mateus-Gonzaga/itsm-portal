# Stack de PRODUÇÃO do portal. Web em :8083 (não conflita com Zabbix/Grafana).
# Banco PostgreSQL próprio (isolado). Use com: bash deploy.sh
#
# Tamanhos AJUSTÁVEIS pelo .env (ver "Recursos" no .env.prod.example). Sem nada
# no .env, vale o perfil da VM de hoje: 3 GB compartilhados com Zabbix, MariaDB e
# Grafana. Os limites de memória são tetos de segurança (o uso normal fica bem
# abaixo) — impedem que um pico do portal derrube os outros serviços.

# Logs dos contêineres com rotação (sem isso crescem sem limite no disco).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Variáveis do PHP sempre definidas (padrão = VM pequena). Lidas pelo
# docker/php-fpm-pool.conf e docker/opcache.ini dentro do contêiner.
x-php-env: &php-env
  PHP_FPM_PM: ${PHP_FPM_PM:-ondemand}
  PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-6}
  PHP_FPM_START_SERVERS: ${PHP_FPM_START_SERVERS:-2}
  PHP_FPM_MIN_SPARE: ${PHP_FPM_MIN_SPARE:-1}
  PHP_FPM_MAX_SPARE: ${PHP_FPM_MAX_SPARE:-3}
  PHP_OPCACHE_MB: ${PHP_OPCACHE_MB:-64}
  PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-192M}

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment: *php-env
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - redis
    mem_limit: ${APP_MEM_LIMIT:-512m}
    logging: *logging

  # Cache do portal (leituras do GLPI). Só memória, com limite e descarte LRU:
  # não cresce sem fim e, se reiniciar, o cache simplesmente recomeça vazio.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_MAXMEMORY:-64mb}", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: ${REDIS_MEM_LIMIT:-96m}
    logging: *logging

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    mem_limit: ${WEB_MEM_LIMIT:-64m}
    logging: *logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-itsm}
      POSTGRES_USER: ${DB_USERNAME:-itsm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    # Banco pequeno: buffers e conexões ajustáveis (o padrão do Postgres reserva 128 MB+).
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-48MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE:-192MB}
      - -c
      - work_mem=${PG_WORK_MEM:-2MB}
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-30}
    volumes:
      - itsm-db:/var/lib/postgresql/data
    mem_limit: ${DB_MEM_LIMIT:-256m}
    logging: *logging

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment: *php-env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - db
      - redis
    command: ["php", "artisan", "schedule:work"]
    mem_limit: ${SCHEDULER_MEM_LIMIT:-256m}
    logging: *logging

volumes:
  itsm-db:
