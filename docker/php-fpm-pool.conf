; Pool do PHP-FPM enxuto para a VM compartilhada (Zabbix + Grafana + portal).
; ondemand: só cria processos quando chega requisição e os encerra após 10 s
; ociosos — em vez de manter vários processos parados ocupando RAM.
[www]
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 10s
; Recicla o processo a cada 500 requisições (evita crescer com o tempo).
pm.max_requests = 500
