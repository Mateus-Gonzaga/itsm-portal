; Pool do PHP-FPM. Os valores vêm de variáveis de ambiente que o
; docker-compose.prod.yml SEMPRE define (com padrão da VM pequena); numa máquina
; maior, ajuste no .env — ver "Recursos" no .env.prod.example.
[www]
; ondemand: cria processos só quando chega requisição e os encerra ociosos (economiza RAM).
; dynamic: mantém processos prontos (mais rápido sob carga constante, usa mais RAM).
pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE}
pm.process_idle_timeout = 10s
; Recicla o processo periodicamente (evita crescer com o tempo).
pm.max_requests = 500
