; OPcache para PRODUÇÃO. Como o deploy recria o container (imagem nova a cada
; mudança de código), validate_timestamps=0 é seguro e dá o melhor desempenho.
; Tamanhos vêm de variáveis que o docker-compose.prod.yml SEMPRE define
; (padrão = VM pequena; ajuste no .env numa máquina maior).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=${PHP_OPCACHE_MB}
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
realpath_cache_size=2048K
realpath_cache_ttl=600
memory_limit=${PHP_MEMORY_LIMIT}
