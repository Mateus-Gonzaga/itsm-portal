; OPcache para PRODUÇÃO. Como o deploy recria o container (imagem nova a cada
; mudança de código), validate_timestamps=0 é seguro e dá o melhor desempenho.
; Tamanhos ajustados ao portal para economizar RAM na VM compartilhada.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
realpath_cache_size=2048K
realpath_cache_ttl=600
; Limite por requisição (os relatórios maiores cabem com folga).
memory_limit=192M
